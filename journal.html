        cursor: pointer;

      #modalOverlay {

      .hidden-modal {

        opacity: 0;
        pointer-events: none;
      }

      .hidden-modal #modalBox {
        transform: scale(0.95) translateY(8px);
        opacity: 0;
      }

    <!-- MODAL -->
    <div
      id="modalWrap"
      class="hidden-modal fixed inset-0 z-50 flex items-center justify-center"
    >
      <div
        id="modalOverlay"
        class="absolute inset-0 bg-black/70"
        onclick="closeModal()"
      ></div>
      <div
        id="modalBox"
        class="relative w-full max-w-md bg-card border border-border rounded-2xl p-6 shadow-2xl"
      >
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-base font-bold text-white">
            Log Trade — <span id="modalDate" class="text-cyan font-mono"></span>

          class="space-y-4 max-h-72 overflow-y-auto pr-1"

          id="addEmiten"
          class="w-full mt-3 flex items-center justify-center gap-2 text-xs font-semibold px-4 py-2.5 rounded-lg bg-white/5 text-slate-300 border border-border hover:border-accent/50 hover:text-white transition"

              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />

          + Add Emiten
        </button>

        <button
          id="confirmTrade"
          class="w-full mt-4 text-sm font-semibold px-4 py-2.5 rounded-lg bg-accent hover:bg-accent/90 text-white transition"
        >
          Confirm &amp; Save
        </button>
      </div>

    <script>
      // ---------- Build August 2025 calendar (starts Friday, 31 days) ----------
      const startDow = 5; // Aug 1, 2025 is a Friday (0=Sun)
      const daysInMonth = 31;
      const pnlSeed = {}; // day -> 'profit' | 'loss' | null
      [3, 7, 8, 12, 15, 19, 20, 22, 27].forEach((d) => (pnlSeed[d] = "profit"));
      [2, 5, 11, 14, 21, 26].forEach((d) => (pnlSeed[d] = "loss"));

      const grid = document.getElementById("calGrid");
      function cellClasses(state) {
        if (state === "profit")
          return "bg-emerald-500/20 border-emerald-500/40 text-emerald-300";
        if (state === "loss")
          return "bg-red-500/20 border-red-500/40 text-red-300";
        return "bg-white/[0.02] border-border text-slate-500";
      }

      function renderCalendar() {
        grid.innerHTML = "";
        for (let i = 0; i < startDow; i++) grid.innerHTML += `<div></div>`;
        for (let d = 1; d <= daysInMonth; d++) {
          const state = pnlSeed[d] || null;
          grid.innerHTML += `
        <div class="day-cell rounded-lg border flex flex-col items-center justify-center ${cellClasses(state)}" onclick="openModal(${d})">
          <span class="text-sm font-mono font-semibold">${d}</span>
          ${state ? `<span class="text-[9px] font-mono mt-0.5">${state === "profit" ? "+" : "−"}Rp</span>` : ""}
        </div>`;
        }
      }
      renderCalendar();

      // ---------- Modal ----------
      const modalWrap = document.getElementById("modalWrap");
      let emitenCount = 0;

      function emitenGroupHTML(idx) {
        return `
      <div class="emiten-group border border-border rounded-xl p-3 space-y-2.5" data-idx="${idx}">
        <input type="text" placeholder="Emiten (e.g. BBRI)" class="w-full bg-card2 border border-border rounded-lg px-3 py-2 text-sm text-white font-mono uppercase focus:outline-none focus:border-accent/60">
        <div class="flex items-center gap-4">
          <label class="flex items-center gap-1.5 text-xs text-slate-300 cursor-pointer">
            <input type="radio" name="pl-${idx}" value="profit" checked class="accent-emerald-500"> Profit
          </label>
          <label class="flex items-center gap-1.5 text-xs text-slate-300 cursor-pointer">
            <input type="radio" name="pl-${idx}" value="loss" class="accent-red-500"> Loss
          </label>
        </div>
        <input type="number" placeholder="Amount (IDR)" class="w-full bg-card2 border border-border rounded-lg px-3 py-2 text-sm text-white font-mono focus:outline-none focus:border-accent/60">
      </div>`;
      }

      function openModal(day) {
        document.getElementById("modalDate").textContent = `${day} Aug 2025`;
        const list = document.getElementById("emitenList");
        list.innerHTML = "";
        emitenCount = 0;
        list.innerHTML += emitenGroupHTML(emitenCount++);
        modalWrap.classList.remove("hidden-modal");
        modalWrap.dataset.day = day;
      }
      function closeModal() {
        modalWrap.classList.add("hidden-modal");
      }

      document.getElementById("addEmiten").addEventListener("click", () => {
        document
          .getElementById("emitenList")
          .insertAdjacentHTML("beforeend", emitenGroupHTML(emitenCount++));
      });

      document.getElementById("confirmTrade").addEventListener("click", () => {
        const day = parseInt(modalWrap.dataset.day, 10);
        const groups = document.querySelectorAll(".emiten-group");
        let hasProfit = false,
          hasLoss = false;
        groups.forEach((g) => {
          const pl = g.querySelector("input[type=radio]:checked").value;
          if (pl === "profit") hasProfit = true;
          else hasLoss = true;
        });
        pnlSeed[day] =
          hasProfit && !hasLoss
            ? "profit"
            : hasLoss && !hasProfit
              ? "loss"
              : "profit";
        renderCalendar();
        closeModal();
      });
    </script>
