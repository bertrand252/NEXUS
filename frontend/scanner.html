<!DOCTYPE html>
<html lang="en">
<head>

<script>
  tailwind.config = { theme: { extend: { colors: {
    base:'#0B0F1A', card:'#111827', card2:'#0F1521', border:'#1F2937',
    accent:'#2563EB', cyan:'#06B6D4', strong:'#EF4444', moderate:'#F97316', weak:'#EAB308', none:'#6B7280'
  }, fontFamily: { sans:['Manrope','sans-serif'], mono:['JetBrains Mono','monospace'] } } } }
</script>
<style>
  body { background-color:#0B0F1A; }
  .glow-border { box-shadow: 0 0 0 1px #1F2937, 0 8px 24px -12px rgba(37,99,235,0.15); }
  .nav-active { background: linear-gradient(90deg, rgba(37,99,235,0.15), transparent); border-left: 2px solid #2563EB; }
  .scrollbar-thin::-webkit-scrollbar { height:6px; width:6px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background:#1F2937; border-radius:4px; }
  .pulse-dot { animation: pulse-dot 2s ease-in-out infinite; }
  @keyframes pulse-dot { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
</style>

      </div>
      <nav class="px-3 py-4 space-y-1 text-sm">

          Dashboard
        </a>
        <a href="scanner.html" class="nav-active flex items-center gap-3 px-3 py-2.5 rounded-r-md text-white font-medium">

        </a>
        <a href="stock-detail.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-slate-400 hover:text-white hover:bg-white/5 transition">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M4 19V13M10 19V9M16 19V5M22 19V11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>

        <a href="market-events.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-slate-400 hover:text-white hover:bg-white/5 transition">

        <a href="portfolio-simulation.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-slate-400 hover:text-white hover:bg-white/5 transition">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          Portfolio Simulation
        </a>
        <a href="journal.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-slate-400 hover:text-white hover:bg-white/5 transition">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="17" rx="2" stroke="currentColor" stroke-width="2"/><path d="M3 10H21" stroke="currentColor" stroke-width="2"/></svg>
          Journal
        </a>
        <a href="analytics.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-slate-400 hover:text-white hover:bg-white/5 transition">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M3 3V21H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M7 15L11 10L14 13L19 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Analytics
        </a>
        <a href="settings.html" class="flex items-center gap-3 px-3 py-2.5 rounded-md text-slate-400 hover:text-white hover:bg-white/5 transition">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/><path d="M19.4 15A1.65 1.65 0 0 0 21 13.35V10.65A1.65 1.65 0 0 0 19.4 9L18.9 8.9A1.65 1.65 0 0 1 17.6 8L17.4 7.5A1.65 1.65 0 0 1 18 5.6L18.1 5.5A1.65 1.65 0 0 0 15.65 3L15.5 3.1A1.65 1.65 0 0 1 13.6 3.7L13.1 3.5A1.65 1.65 0 0 0 11.4 3H8.6A1.65 1.65 0 0 0 6.9 3.5L6.4 3.7A1.65 1.65 0 0 1 4.5 3.1L4.4 3A1.65 1.65 0 0 0 1.95 5.5L2.05 5.6A1.65 1.65 0 0 1 2.65 7.5L2.45 8A1.65 1.65 0 0 1 1.15 8.9L1.05 9A1.65 1.65 0 0 0 0 10.65V13.35A1.65 1.65 0 0 0 1.05 15L1.15 15.1A1.65 1.65 0 0 1 2.45 16L2.65 16.5A1.65 1.65 0 0 1 2.05 18.4L1.95 18.5A1.65 1.65 0 0 0 4.4 21L4.5 20.9A1.65 1.65 0 0 1 6.4 20.3L6.9 20.5A1.65 1.65 0 0 0 8.6 21H11.4A1.65 1.65 0 0 0 13.1 20.5L13.6 20.3A1.65 1.65 0 0 1 15.5 20.9L15.65 21A1.65 1.65 0 0 0 18.1 18.5L18 18.4A1.65 1.65 0 0 1 17.6 16.5L17.4 16A1.65 1.65 0 0 1 18.9 15.1Z" stroke="currentColor" stroke-width="1.6"/></svg>
          Settings
        </a>
      </nav>
    </div>
    <div class="px-4 py-4 border-t border-border">
      <button class="w-full flex items-center gap-2 justify-center text-xs text-slate-500 hover:text-slate-300 py-2 mb-2 transition">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Collapse
      </button>
      <div class="flex items-center gap-3 px-2 py-2 rounded-lg hover:bg-white/5 transition cursor-pointer">
        <div class="w-9 h-9 rounded-full bg-gradient-to-br from-cyan to-accent flex items-center justify-center text-xs font-bold text-white shrink-0">RA</div>
        <div class="min-w-0">
          <p class="text-sm font-semibold text-white truncate">Rian Adnan</p>
          <p class="text-[11px] text-slate-500 truncate">Pro Trader</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="ml-64 flex-1 flex flex-col min-h-screen">
    <header class="sticky top-0 z-10 bg-[#0B0F1A]/90 backdrop-blur border-b border-border px-8 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-bold text-white tracking-tight">Scanner</h1>
        <p class="text-xs text-slate-500 mt-0.5 font-mono">Friday, 08 August 2025</p>
      </div>
      <div class="flex items-center gap-4">
        <span class="flex items-center gap-2 text-xs font-semibold px-3 py-1.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 pulse-dot"></span> MARKET OPEN
        </span>
        <button class="relative w-9 h-9 rounded-lg bg-card border border-border flex items-center justify-center hover:border-accent/50 transition">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M18 8A6 6 0 0 0 6 8C6 15 3 17 3 17H21S18 15 18 8Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.73 21A2 2 0 0 1 10.27 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-strong"></span>
        </button>
      </div>
    </header>

    <div class="p-8 space-y-5">

      <!-- FILTER BAR -->
      <div class="flex items-center gap-3 flex-wrap">
        <div class="relative flex-1 min-w-[220px] max-w-xs">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500" width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input type="text" placeholder="Search ticker..." class="w-full bg-card border border-border rounded-lg pl-9 pr-3 py-2 text-sm text-white placeholder:text-slate-500 focus:outline-none focus:border-accent/60">
        </div>
        <select class="bg-card border border-border rounded-lg px-3 py-2 text-sm text-slate-300 focus:outline-none focus:border-accent/60">
          <option>All Signals</option>
          <option>🔴 Strong</option>
          <option>🟠 Moderate</option>
          <option>🟡 Weak</option>
          <option>⚪ No Signal</option>
        </select>
        <select class="bg-card border border-border rounded-lg px-3 py-2 text-sm text-slate-300 focus:outline-none focus:border-accent/60">
          <option>All Sectors</option>
          <option>Banking</option>
          <option>Energy</option>
          <option>Consumer</option>
          <option>Technology</option>
          <option>Basic Materials</option>
        </select>
        <button class="ml-auto flex items-center gap-2 text-xs font-semibold px-4 py-2 rounded-lg bg-accent/10 text-accent border border-accent/30 hover:bg-accent/20 transition">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 4V20M4 4H14L20 10V20H4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Score ≥ 50 filter
        </button>
      </div>

      <!-- SCANNER TABLE -->
      <div class="glow-border rounded-2xl bg-card border border-border overflow-hidden">
        <div class="overflow-x-auto scrollbar-thin">
          <table class="w-full text-sm">
            <thead>
              <tr class="text-left text-[11px] uppercase tracking-wider text-slate-500 border-b border-border bg-white/[0.02]">
                <th class="px-5 py-3 font-medium">Ticker</th>
                <th class="px-5 py-3 font-medium">Price</th>
                <th class="px-5 py-3 font-medium">Change</th>
                <th class="px-5 py-3 font-medium">Volume Ratio</th>
                <th class="px-5 py-3 font-medium">Score (0–100)</th>
                <th class="px-5 py-3 font-medium">Signal Status</th>
                <th class="px-5 py-3 font-medium text-right">Action</th>
              </tr>
            </thead>
            <tbody id="scanBody" class="divide-y divide-border/60 font-mono text-[13px]"></tbody>
          </table>
        </div>
      </div>

      <p class="text-xs text-slate-500 text-center pt-1" id="statusLine">Loading...</p>
    </div>
  </main>
</div>

<script>
  const API_BASE = 'http://localhost:8000';

  // backend doesn't know sector names — keep a small client-side lookup for display only
  const SECTOR = { ANTM:'Basic Materials', BBRI:'Banking', ADRO:'Energy', ASII:'Consumer',
    BMRI:'Banking', ICBP:'Consumer', TLKM:'Technology', GOTO:'Technology', UNVR:'Consumer', MDKA:'Basic Materials' };

  function signalMeta(signal) {
    if (signal === 'Strong') return { dot:'🔴', cls:'bg-strong/10 text-strong border-strong/30' };
    if (signal === 'Moderate') return { dot:'🟠', cls:'bg-moderate/10 text-moderate border-moderate/30' };
    if (signal === 'Weak') return { dot:'🟡', cls:'bg-weak/10 text-weak border-weak/30' };
    return { dot:'⚪', cls:'bg-none/10 text-slate-400 border-none/30' };
  }

  function renderRow(s) {
    const m = signalMeta(s.signal);
    return `
      <tr class="hover:bg-white/[0.03] transition">
        <td class="px-5 py-3">
          <p class="font-sans font-semibold text-white">${s.ticker}</p>
          <p class="text-[10px] text-slate-500 font-sans">${SECTOR[s.ticker] || '—'}</p>
        </td>
        <td class="px-5 py-3 text-slate-300">Rp ${s.price.toLocaleString('id-ID')}</td>
        <td class="px-5 py-3 ${s.change_pct>=0?'text-emerald-400':'text-red-400'}">${s.change_pct>=0?'+':''}${s.change_pct}%</td>
        <td class="px-5 py-3 text-slate-300">${s.volume_ratio}x</td>
        <td class="px-5 py-3">
          <div class="flex items-center gap-2">
            <span class="text-white font-semibold">${s.total_score}</span>
            <div class="w-16 h-1.5 rounded-full bg-white/5 overflow-hidden">
              <div class="h-full rounded-full bg-gradient-to-r from-accent to-cyan" style="width:${s.total_score}%"></div>
            </div>
          </div>
        </td>
        <td class="px-5 py-3"><span class="text-[10px] font-semibold px-2 py-0.5 rounded-full border ${m.cls}">${m.dot} ${s.signal === 'None' ? 'No Signal' : s.signal}</span></td>
        <td class="px-5 py-3 text-right">
          <a href="stock-detail.html?t=${s.ticker}" class="text-[11px] font-sans font-semibold px-3 py-1.5 rounded-lg bg-accent/10 text-accent border border-accent/30 hover:bg-accent/20 transition">View</a>
        </td>
      </tr>`;
  }

  async function loadScanner() {
    const body = document.getElementById('scanBody');
    const status = document.getElementById('statusLine');
    try {
      const res = await fetch(`${API_BASE}/scanner`);
      if (!res.ok) throw new Error(`Backend error ${res.status}`);
      const { data, errors } = await res.json();

      body.innerHTML = data.map(renderRow).join('');
      const time = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      status.textContent = `Showing ${data.length} of ${data.length + errors.length} IDX tickers · Refreshed ${time} WIB` +
        (errors.length ? ` · ${errors.length} gagal dimuat (${errors.map(e => e.ticker).join(', ')})` : '');
    } catch (err) {
      body.innerHTML = `<tr><td colspan="7" class="px-5 py-8 text-center text-sm text-slate-500">
        Gak bisa konek ke backend (${API_BASE}). Pastikan <code class="text-cyan">uvicorn main:app --reload --port 8000</code> lagi jalan.
      </td></tr>`;
      status.textContent = 'Gagal memuat data';
    }
  }

  loadScanner();
</script>
</body>
</html>
